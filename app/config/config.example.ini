; DB SECTION
; dsn  - the Data Source Name contains the information required to connect to 
; the database. In general, a DSN consists of the PDO driver name, followed by a 
; colon, followed by the PDO driver-specific connection syntax. 
; username - the user name for the DSN string. This parameter is optional for some PDO drivers.
; password - the password for the DSN string. This parameter is optional for some PDO drivers.

[db]
dsn = 'mysql:host=localhost;dbname=em'
username = 'root'
password = ''

; The base URL of the MVC application. 

[app]
project_url = "http://localhost/Project1"
;project_url = "https://web01.gccis.rit.edu/~mb8561/iste-341/Project1"

[session]
session_timeout = 300
